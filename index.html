<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>운반비 계산 프로그램</title>
<style>
  :root{
    --blue:#2563eb; --blue-dark:#1d4ed8; --bg:#f4f6fb; --card:#ffffff;
    --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --green:#059669; --red:#dc2626;
    --amber:#d97706;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--blue);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  header h1{margin:0;font-size:18px;font-weight:700;}
  header p{margin:4px 0 0;font-size:12px;opacity:.85;}
  .wrap{max-width:720px;margin:0 auto;padding:14px;}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border);}
  .card h2{font-size:15px;margin:0 0 12px;color:var(--blue-dark);display:flex;align-items:center;gap:6px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px;}
  label:first-of-type{margin-top:0;}
  select, input[type=number], input[type=text]{
    width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;
    font-size:15px;background:#fff;color:var(--text);
  }
  select:focus, input:focus{outline:none;border-color:var(--blue);}
  .radio-row{display:flex;gap:8px;}
  .radio-row button{
    flex:1;padding:11px 6px;border-radius:10px;border:1.5px solid var(--border);background:#fff;
    font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;
  }
  .radio-row.small button{padding:9px 6px;font-size:13px;}
  .radio-row button.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .hint.warn{color:var(--amber);}
  .search-box{position:relative;}
  .search-results{
    position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1.5px solid var(--border);
    border-radius:10px;max-height:260px;overflow-y:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none;
  }
  .search-results.show{display:block;}
  .search-results div{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid #f1f1f1;}
  .search-results div:last-child{border-bottom:none;}
  .search-results div:hover, .search-results div.hl{background:#eff4ff;}
  .search-results .grp{font-size:11px;color:var(--muted);}
  .selected-site{margin-top:8px;padding:9px 12px;background:#eff6ff;border-radius:10px;font-size:13.5px;color:var(--blue-dark);font-weight:600;display:none;}
  .selected-site.show{display:block;}
  .regua-box{display:none;border-top:1px dashed var(--border);margin-top:12px;padding-top:12px;}
  .regua-box.show{display:block;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
  .toggle-row label{margin:0;}
  .switch{position:relative;width:46px;height:26px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#d1d5db;border-radius:26px;transition:.2s;}
  .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
  input:checked + .slider{background:var(--blue);}
  input:checked + .slider:before{transform:translateX(20px);}
  .btn-primary{
    width:100%;padding:15px;border:none;border-radius:12px;background:var(--blue);color:#fff;
    font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;
  }
  .btn-primary:active{background:var(--blue-dark);}
  .btn-primary:disabled{background:#9ca3af;cursor:not-allowed;}
  .btn-secondary{
    width:100%;padding:12px;border:1.5px dashed var(--blue);border-radius:12px;background:#eff6ff;color:var(--blue-dark);
    font-size:14px;font-weight:700;cursor:pointer;
  }
  .btn-secondary:disabled{opacity:.4;cursor:not-allowed;border-style:solid;background:#f4f6fb;color:var(--muted);}
  .result-card{display:none;}
  .result-card.show{display:block;}
  .big-number{font-size:28px;font-weight:800;color:var(--blue-dark);margin:2px 0 0;}
  .big-number span{font-size:14px;font-weight:600;color:var(--muted);}
  .sub-number{font-size:13px;color:var(--muted);margin-top:2px;}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--border);}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--muted);font-weight:600;font-size:12px;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;background:#eff6ff;color:var(--blue-dark);font-size:11px;font-weight:700;}
  .divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
  .row-between{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:14px;}
  .row-between .lbl{color:var(--muted);}
  .row-between .val{font-weight:700;}
  .final-box{background:#f0f9f4;border:1.5px solid #bbf7d0;border-radius:12px;padding:14px;margin-top:10px;}
  .final-box .amount{font-size:22px;font-weight:800;color:var(--green);}
  .note-box{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#92400e;margin-top:10px;line-height:1.6;}
  .remainder-select{margin-top:8px;}
  footer{text-align:center;font-size:11px;color:#9ca3af;padding:20px 0 30px;}
  .disabled-overlay{opacity:.45;pointer-events:none;}
  .line-card{border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;background:#fafbfe;}
  .line-card:last-child{margin-bottom:0;}
  .line-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .line-header .line-title{font-size:13.5px;font-weight:700;color:var(--blue-dark);}
  .remove-line{background:none;border:none;color:var(--red);font-size:20px;font-weight:700;cursor:pointer;line-height:1;padding:2px 6px;}
  .lines-wrap{margin-bottom:10px;}
  .mix-note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:8px;}
</style>
</head>
<body>
<header>
  <h1>🚚 운반비 계산 프로그램</h1>
  <p>제품 규격 · 물량 · 현장을 입력하면 최적 운반 대수와 단가를 계산합니다</p>
</header>

<div class="wrap">

  <div class="card">
    <h2>① 제품 선택 (최대 3개까지 함께 계산)</h2>
    <div class="lines-wrap" id="linesWrap"></div>
    <button type="button" class="btn-secondary" id="addLineBtn" onclick="addLine()">+ 제품 추가</button>
    <div class="mix-note" id="mixNote" style="display:none;"></div>
  </div>

  <div class="card" id="mixOptionsCard" style="display:none;">
    <h2>혼적(섞어 싣기) 옵션</h2>
    <div class="toggle-row">
      <label style="margin:0;">근거리 특례: 28톤까지 허용</label>
      <label class="switch"><input type="checkbox" id="shorthaulToggle"><span class="slider"></span></label>
    </div>
    <div class="hint warn">대구~구미 등 근거리 노선에서만 사용하세요. 그 외 지역은 과적 단속 위험이 있어 기본값(27.2톤)을 권장합니다.</div>
  </div>

  <div class="card">
    <h2>② 현장 지역</h2>
    <label>지역 검색 (예: 울산, 수원, 광주)</label>
    <div class="search-box">
      <input type="text" id="siteSearch" placeholder="지역명을 입력하세요" autocomplete="off" oninput="onSiteSearch()">
      <div class="search-results" id="siteResults"></div>
    </div>
    <div class="selected-site" id="selectedSite"></div>
  </div>

  <button class="btn-primary" id="calcBtn" onclick="calculate()">운반비 계산하기</button>

  <div class="card result-card" id="resultCard">
    <h2>📦 계산 결과</h2>
    <div id="resultBody"></div>
  </div>

  <footer>사내용 운반비 계산 도구 · 제품/요율 데이터 기준일 2026-08 · 버전 2026-08-27 11:41 KST</footer>
</div>

  lineCount++;
  populateProducts(idx);
  refreshLineChrome();

function removeLine(idx){
  const el = document.getElementById('lineCard_'+idx);
  if(el) el.remove();
  lineCount--;
  refreshLineChrome();

function refreshLineChrome(){

// ================= CALCULATION HELPERS =================
function nearestTier(weight){
  let best = TIERS_UNIQUE[0];
  let bestDiff = Math.abs(weight - best.w);
  for(const t of TIERS_UNIQUE){
    const d = Math.abs(weight - t.w);
    if(d < bestDiff - 1e-9){ best = t; bestDiff = d; }
    else if(Math.abs(d-bestDiff) < 1e-9 && t.w < best.w){ best = t; bestDiff = d; }
  }
  return best;
}

function fmt(n){ return Math.round(n).toLocaleString(); }
function fmt2(n){ return (Math.round(n*100)/100).toLocaleString(); }

function tierSelectHtml(rates, selectedKey, id){
  const opts = TIERS.map(t=>
    `<option value="${t.key}" ${t.key===selectedKey?'selected':''}>${t.key}${t.key==='5톤축'?'(최대12t)':''} (${rates[t.key]!==undefined? (rates[t.key]*10000).toLocaleString()+'원':'요율없음'})</option>`
  ).join('');
  return `<select id="${id}" onchange="onTierChange()">${opts}</select>`;
}

  const basePrice = parseFloat(document.getElementById('basePriceInput_'+idx).value) || 0;

// ================= SINGLE-LINE ENGINE (precise per-product model) =================
function computeSingleLine(line){
  const {p, qty, reguaOn, bags, unitWeight, unitLabel, capacity, tab} = line;

  if(!capacity){
    return {error: '이 제품은 25톤 1대 기준 적재량 데이터가 없어 단독 계산이 불가능합니다. 다른 제품과 함께(2개 이상) 넣으면 무게 기준으로 계산할 수 있습니다.'};
  }

  const maxBagsPerTruck = p.regua_max_bags_per_truck || 1;
  const capNormal = capacity;
  const capRegua = (tab==='block' && p.truck25_m2_regua) ? p.truck25_m2_regua : capacity;

  let fullTrucks, remainder, regTrucks = 0;

  if(reguaOn && bags>0){
    regTrucks = Math.ceil(bags / maxBagsPerTruck);
    const remainingAfterRegua = qty - regTrucks*capRegua;
    if(remainingAfterRegua <= 0){
      fullTrucks = regTrucks;
      remainder = 0;
    } else {
      const fullTrucksNormal = Math.floor(remainingAfterRegua / capNormal);
      const loadedNormal = fullTrucksNormal * capNormal;
      remainder = remainingAfterRegua - loadedNormal;
      if(remainder < 1e-9) remainder = 0;
      fullTrucks = regTrucks + fullTrucksNormal;
    }
  } else {
    fullTrucks = Math.floor(qty / capNormal);
    const loaded = fullTrucks * capNormal;
    remainder = qty - loaded;
    if(remainder < 1e-9) remainder = 0;
  }

  const remainderWeight = remainder * unitWeight;
  const suggestedTier = remainder>0 ? nearestTier(remainderWeight) : null;

  return {
    p, qty, unitLabel, unitWeight, fullTrucks, remainder, remainderWeight, suggestedTier,
    regTrucks, capNormal, capRegua, reguaOn, bags
  };
}

// ================= MIXED (2~3 line) ENGINE — weight-based =================
function computeMixed(lines, maxCap){
  const items = lines.map(line=>({
    line, weight: line.qty * line.unitWeight
  }));
  const totalWeight = items.reduce((s,i)=>s+i.weight, 0);
  const fullTrucks = Math.floor(totalWeight / maxCap);
  const loaded = fullTrucks * maxCap;
  let remainderWeight = totalWeight - loaded;
  if(remainderWeight < 1e-9) remainderWeight = 0;
  const suggestedTier = remainderWeight>0 ? nearestTier(remainderWeight) : null;
  return {items, totalWeight, fullTrucks, remainderWeight, suggestedTier};
}

function renderMixed(calc, rates, tierKey, maxCap){
  const rate25 = rates['25톤'] || 0;
  const total = calc.fullTrucks*rate25*10000 + (calc.remainderWeight>0 && tierKey ? (rates[tierKey]||0)*10000 : 0);

  html += `<hr class="divider">`;
  html += `<div><span class="badge">제품별 중량</span></div>`;
  html += `<table><thead><tr><th>제품</th><th>물량</th><th>중량</th></tr></thead><tbody>`;
  calc.items.forEach(it=>{
    html += `<tr><td>${it.line.p.name}</td><td>${fmt2(it.line.qty)} ${it.line.unitLabel}</td><td>${fmt2(it.weight)}톤</td></tr>`;
  });
  html += `</tbody></table>`;
  html += `<div class="row-between"><span class="lbl">총 중량</span><span class="val">${fmt2(calc.totalWeight)}톤</span></div>`;

  html += `<hr class="divider">`;
  html += `<div><span class="badge">최적 운반 구성 (섞어 싣기)</span></div>`;
  html += `<table><thead><tr><th>구간</th><th>수량</th><th>단가</th><th>금액</th></tr></thead><tbody>`;
  if(calc.fullTrucks>0){
    html += `<tr><td>25톤 트럭</td><td>${calc.fullTrucks}대</td><td>${(rate25*10000).toLocaleString()}원</td><td>${fmt(calc.fullTrucks*rate25*10000)}원</td></tr>`;
  }
  if(calc.remainderWeight>0){
    html += `<tr><td>잔여 중량</td><td>약 ${fmt2(calc.remainderWeight)}톤</td><td colspan="2"></td></tr>`;
  }
  if(calc.fullTrucks===0 && calc.remainderWeight<=0){
    html += `<tr><td>25톤 트럭</td><td>0대</td><td colspan="2"></td></tr>`;
  }
  html += `</tbody></table>`;

  if(calc.remainderWeight>0){
    html += `<div class="remainder-select">
      <label>잔여 중량 배차 톤급 (자동 추천: <b>${calc.suggestedTier.key}</b>, 필요시 변경 가능)</label>
      ${tierSelectHtml(rates, tierKey, 'tierSelect')}
    </div>`;
  }

  html += `<hr class="divider">`;
  html += `<div class="row-between"><span class="lbl">운반비 합계</span><span class="val">${fmt(total)}원</span></div>`;

  html += `<hr class="divider">`;
  html += `<div><span class="badge">제품별 배분 (중량 비중 안분)</span></div>`;
  html += `<table><thead><tr><th>제품</th><th>배분 운반비</th><th>단위당 운반비</th></tr></thead><tbody>`;
  const lineResults = [];
  calc.items.forEach(it=>{
    const share = it.weight / calc.totalWeight;
    const allocated = total * share;
    const perUnit = allocated / it.line.qty;
    lineResults.push({...it, allocated, perUnit});
    html += `<tr><td>${it.line.p.name}</td><td>${fmt(allocated)}원</td><td>${fmt(perUnit)}원/${it.line.unitLabel}</td></tr>`;
  });
  html += `</tbody></table>`;

  // regua per line (flat, informational — not part of weight/capacity calc)
  const reguaLines = calc.items.filter(it=>it.line.bags>0);
  if(reguaLines.length>0){
    html += `<hr class="divider">`;
    html += `<div><span class="badge">규사 (제품별 개별 가산, 적재량 계산에는 미반영)</span></div>`;
    reguaLines.forEach(it=>{
      const reguaCost = it.line.bags*120000;
      const perUnitRegua = reguaCost/it.line.qty;
      html += `<div class="row-between"><span class="lbl">${it.line.p.name} 규사 ${it.line.bags}포</span><span class="val">${fmt(reguaCost)}원 (${fmt(perUnitRegua)}원/${it.line.unitLabel})</span></div>`;
    });
  }

  // final price per line if base price given
  const withBase = lineResults.filter(it=>it.line.basePrice>0);
  if(withBase.length>0){
    html += `<hr class="divider">`;
    html += `<div><span class="badge">제품별 최종 판매단가</span></div>`;
    withBase.forEach(it=>{
      const reguaCost = it.line.bags>0 ? it.line.bags*120000 : 0;
      const perUnitRegua = it.line.bags>0 ? reguaCost/it.line.qty : 0;
      const finalPrice = Math.round(it.line.basePrice)+Math.round(it.perUnit)+Math.round(perUnitRegua);
      html += `<div class="final-box">
        <div style="font-size:13px;color:var(--muted);margin-bottom:4px;">${it.line.p.name}</div>
        <div class="amount">${fmt(finalPrice)}원 <span style="font-size:13px;color:var(--muted);font-weight:600;">/ ${it.line.unitLabel}</span></div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px;">= 기본단가 ${fmt(it.line.basePrice)}원 + 운반비 ${fmt(it.perUnit)}원${it.line.bags>0?' + 규사비 '+fmt(perUnitRegua)+'원':''}</div>
      </div>`;
    });
  }

  html += `<div class="note-box">섞어 싣기 계산은 무게(톤) 기준입니다. 제품 부피/팔레트 배치 등 실제 적재 공간 제약은 반영되지 않았으니 대량 주문 시 현장 담당자 확인을 권장합니다.</div>`;

  return html;
}

// ================= MAIN CALCULATE =================
let lastCalcState = null; // stores everything needed to re-render on tier change

function calculate(){
  const resultCard = document.getElementById('resultCard');
  const body = document.getElementById('resultBody');

  if(!selectedSiteEntry){ alert('현장 지역을 선택해 주세요.'); return; }

  const lines = [];
  for(let i=0;i<3;i++){
    const card = document.getElementById('lineCard_'+i);
    if(!card) continue;
    const line = gatherLine(i);
    if(!line.qty || line.qty<=0){ alert(`제품 ${i+1}의 물량을 입력해 주세요.`); return; }
    lines.push(line);
  }
  if(lines.length===0){ alert('제품을 1개 이상 입력해 주세요.'); return; }

  const rates = selectedSiteEntry.rates;
  remainderTierKeyOverride = null;

  if(lines.length===1){
    const line = lines[0];
    const calc = computeSingleLine(line);
    if(calc.error){
      body.innerHTML = `<div class="note-box">⚠ ${calc.error}</div>`;
      resultCard.classList.add('show');
      resultCard.scrollIntoView({behavior:'smooth'});
      return;
    }
    lastCalcState = {mode:'single', line, calc, rates};
    body.innerHTML = renderSingleLine(line, calc, rates, calc.suggestedTier ? calc.suggestedTier.key : null);
  } else {
    // check all lines have valid weight data (always true since weight_per_m2/weight_per_ea always present)
    const shorthaul = document.getElementById('shorthaulToggle').checked;
    const maxCap = shorthaul ? MIX_CONFIG.max_cap_ton_shorthaul : MIX_CONFIG.max_cap_ton_default;
    const calc = computeMixed(lines, maxCap);
    lastCalcState = {mode:'mixed', lines, calc, rates, maxCap};
    body.innerHTML = renderMixed(calc, rates, calc.suggestedTier ? calc.suggestedTier.key : null, maxCap);
  }

  resultCard.classList.add('show');
  resultCard.scrollIntoView({behavior:'smooth'});
}

window.onTierChange = function(){
  const sel = document.getElementById('tierSelect');
  if(!sel || !lastCalcState) return;
  const tierKey = sel.value;
  const body = document.getElementById('resultBody');
  if(lastCalcState.mode==='single'){
    body.innerHTML = renderSingleLine(lastCalcState.line, lastCalcState.calc, lastCalcState.rates, tierKey);
  } else {
    body.innerHTML = renderMixed(lastCalcState.calc, lastCalcState.rates, tierKey, lastCalcState.maxCap);
  }
};

// init
addLine();
</script>
